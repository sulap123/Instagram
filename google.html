<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Google" />
  <meta name="theme-color" content="#ffffff" />
  <title>Google</title>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Roboto", "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #202124;
      overflow-x: hidden;
    }

    .page-wrapper {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: max(env(safe-area-inset-top), 12px);
      padding-bottom: max(env(safe-area-inset-bottom), 14px);
    }

    /* Top Nav */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 16px;
      font-size: 13px;
      color: #5f6368;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .top-tab {
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.4px;
      padding-bottom: 6px;
      text-transform: uppercase;
      color: #5f6368;
      cursor: pointer;
    }

    .top-tab.active {
      color: #1a73e8;
      border-bottom: 2px solid #1a73e8;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .apps-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5f6368;
      cursor: pointer;
    }

    .avatar-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4285f4, #1a73e8);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    /* Center Search Area */
    .main-search {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 18px 20px 18px;
      flex: 1;
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
    }

    .google-logo {
      margin-top: 26px;
      margin-bottom: 26px;
      user-select: none;
      cursor: pointer;
    }

    .search-box-container {
      width: 100%;
      position: relative;
      z-index: 20;
    }

    .search-bar {
      width: 100%;
      min-height: 46px;
      border-radius: 24px;
      border: 1px solid #dfe1e5;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.12);
      transition: border-radius 0.12s ease, box-shadow 0.12s ease;
    }

    .search-bar.dropdown-open {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      border-bottom-color: transparent;
      box-shadow: 0 3px 8px rgba(32, 33, 36, 0.18);
    }

    .search-icon {
      color: #9aa0a6;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      color: #202124;
      background: transparent;
      padding: 10px 0;
      min-width: 0;
    }

    .clear-btn {
      background: none;
      border: none;
      color: #70757a;
      font-size: 18px;
      padding: 4px 6px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-btn.visible {
      display: flex;
    }

    .mic-lens-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Autocomplete Dropdown */
    .autocomplete-box {
      width: 100%;
      background-color: #ffffff;
      border: 1px solid #dfe1e5;
      border-top: none;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 4px 8px rgba(32, 33, 36, 0.18);
      display: none;
      flex-direction: column;
      padding-bottom: 10px;
      overflow: hidden;
    }

    .autocomplete-box.open {
      display: flex;
    }

    .ac-divider {
      height: 1px;
      background-color: #e8eaed;
      margin: 0 16px 6px 16px;
    }

    .ac-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      font-size: 15px;
      color: #202124;
      cursor: pointer;
    }

    .ac-item:active {
      background-color: #f1f3f4;
    }

    .ac-icon {
      color: #9aa0a6;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .ac-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ac-sub {
      font-size: 12px;
      color: #70757a;
      display: block;
    }

    /* Search Action Buttons */
    .search-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .g-btn {
      background-color: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 6px;
      color: #3c4043;
      font-size: 14px;
      padding: 9px 16px;
      cursor: pointer;
    }

    .g-btn:active {
      border-color: #dadce0;
      background-color: #f1f3f4;
    }

    /* Trending Section */
    .trending-section {
      width: 100%;
      margin-top: 34px;
    }

    .trending-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 500;
      color: #202124;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .trending-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 4px;
      border-bottom: 1px solid #f1f3f4;
      font-size: 15px;
      color: #202124;
      cursor: pointer;
    }

    .trending-item:last-child {
      border-bottom: none;
    }

    /* Footer */
    .footer-bar {
      background-color: #f2f2f2;
      color: #70757a;
      font-size: 13px;
      padding: 12px 18px;
      text-align: center;
      border-top: 1px solid #dadce0;
      margin-top: 20px;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 8px;
      font-size: 12px;
    }

    /* Fake Google Search Results View */
    .results-view {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      background-color: #ffffff;
      padding-top: max(env(safe-area-inset-top), 10px);
    }

    .results-view.active {
      display: flex;
    }

      padding: 8px 14px 10px 1
